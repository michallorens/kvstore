[project]
name = "kvstore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michał Lorens", email = "michallorens@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
kvstore = "kvstore:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.0",
    "prettier>=0.0.7",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-profiling>=1.8.1",
    "ruff>=0.16.4",
    "ty>=0.0.75",
    "yamllint>=1.38.0",
]

[tool.ruff]
line-length = 89

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
